name: Build Android APK

# Standalone APK build that does not depend on EAS. Produces a signed,
# installable release APK as a workflow artifact and, on a version tag,
# attaches it to a GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  # No Sentry auth token is configured for this build, so skip the source-map
  # upload step (it otherwise fails the release bundle task).
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'
  SENTRY_ALLOW_FAILURE: 'true'
  KEYSTORE_PASSWORD: cherrystudio
  KEY_ALIAS: cherrystudio

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # The runner image already ships the Android SDK. The setup-android
      # action's license step is interactive and aborts here, so licenses are
      # accepted directly against the preinstalled sdkmanager instead.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # A throwaway signing key so the release APK installs on a device. Expo's
      # release build is otherwise unsigned and Android rejects it as invalid.
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Cherry Studio Super Agent,O=Cherry Studio,C=IN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android native project
        env:
          PROFILE: production
        run: npx expo prebuild --platform android --no-install

      # Release lint (lintVital) is skipped: it OOMs the Gradle daemon
      # (Metaspace) on this dependency graph and is not needed to produce the
      # APK. Signing is injected via android.injected.signing.* so the generated
      # Gradle project does not need editing. Metaspace is raised as a
      # belt-and-braces measure.
      - name: Build signed release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease --no-daemon
          -x lintVitalRelease -x lintVitalAnalyzeRelease
          -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1536m"
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS
          -Pandroid.injected.signing.key.password=$KEYSTORE_PASSWORD

      - name: Verify APK signature and rename
        working-directory: android
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          apksigner=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          mv "$apk" app/build/outputs/apk/release/cherry-studio-superagent.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CherryStudio-SuperAgent-APK
          path: android/app/build/outputs/apk/release/cherry-studio-superagent.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/cherry-studio-superagent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

# Standalone APK build that does not depend on EAS. Produces a signed,
# installable release APK as a workflow artifact and, on a version tag,
# attaches it to a GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  # No Sentry auth token is configured for this build, so skip the source-map
  # upload step (it otherwise fails the release bundle task).
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'
  SENTRY_ALLOW_FAILURE: 'true'
  KEYSTORE_PASSWORD: cherrystudio
  KEY_ALIAS: cherrystudio
  # A single throwaway signing key, base64-encoded, reused for every build so
  # successive APKs share one signature and update in place instead of
  # conflicting with an existing install. (Move to a repository secret if you
  # prefer not to keep it in the workflow file.)
  KEYSTORE_BASE64: ''

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # The runner image already ships the Android SDK. The setup-android
      # action's license step is interactive and aborts here, so licenses are
      # accepted directly against the preinstalled sdkmanager instead.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore release keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sideload build: give the APK a distinct Android package id so it installs
      # alongside an existing Cherry Studio that was signed with another key,
      # instead of being rejected as a package conflict. The source keeps the
      # upstream package id.
      - name: Set a distinct Android package id
        run: |
          jq '.expo.android.package = "com.cherryai.cherrystudio_superagent"
              | .expo.android.permissions = (((.expo.android.permissions // []) + ["android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"]) | unique)' app.json > app.json.patched
          mv app.json.patched app.json
          grep -n '"package"\|REQUEST_IGNORE_BATTERY' app.json

      - name: Prebuild Android native project
        env:
          PROFILE: production
        run: npx expo prebuild --platform android --no-install

      # Release lint (lintVital) is skipped: it OOMs the Gradle daemon
      # (Metaspace) on this dependency graph and is not needed to produce the
      # APK. Metaspace is raised as a belt-and-braces measure.
      - name: Build release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease --no-daemon
          -x lintVitalRelease -x lintVitalAnalyzeRelease
          -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1536m"

      # Expo's release build only gets a v2 signature. Devices/ROMs that do not
      # accept a v1-less APK reject it as "package appears to be invalid", so the
      # APK is re-signed with the v1 (JAR), v2 and v3 schemes for compatibility.
      - name: Re-sign APK with v1 + v2 + v3 schemes
        working-directory: android
        run: |
          set -euo pipefail
          bt=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          in_apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$bt/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/release.keystore" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --min-sdk-version 26 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out app/build/outputs/apk/release/cherry-studio-superagent.apk \
            "$in_apk"

      - name: Verify APK signature schemes
        working-directory: android
        run: |
          set -euo pipefail
          bt=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          out=$("$bt/apksigner" verify --min-sdk-version 23 --verbose \
            app/build/outputs/apk/release/cherry-studio-superagent.apk)
          echo "$out"
          echo "$out" | grep -q "Verified using v1 scheme (JAR signing): true"
          echo "$out" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CherryStudio-SuperAgent-APK
          path: android/app/build/outputs/apk/release/cherry-studio-superagent.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/cherry-studio-superagent.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
